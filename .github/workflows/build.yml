name: Build & push Caddy image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  schedule:
    # Cada dilluns a les 04:00 UTC, per agafar noves versions de Caddy
    # i del mòdul de Cloudflare (i pegats de seguretat de la imatge base).
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) Build local per poder comprovar-la i saber quina versió de Caddy porta.
      #    pull: true -> sempre l'última imatge base caddy:2 / caddy:2-builder
      #    CACHE_BUST -> sempre recompila xcaddy (última versió del mòdul Cloudflare)
      - name: Build (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: caddy-test:local
          build-args: |
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify Cloudflare module & get Caddy version
        id: caddy
        run: |
          docker run --rm caddy-test:local caddy list-modules | grep -q '^dns.providers.cloudflare$' \
            || { echo "::error::El mòdul dns.providers.cloudflare no hi és"; exit 1; }
          version=$(docker run --rm caddy-test:local caddy version | awk '{print $1}' | sed 's/^v//')
          cf_version=$(docker run --rm caddy-test:local caddy list-modules --versions | awk '$1=="dns.providers.cloudflare"{print $2}')
          echo "Caddy: $version | caddy-dns/cloudflare: $cf_version"
          echo "### Caddy \`$version\` · caddy-dns/cloudflare \`$cf_version\`" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.caddy.outputs.version }}
            type=raw,value=${{ steps.caddy.outputs.version }}-{{date 'YYYYMMDD'}}
            type=sha,format=short

      # 2) Push. Mateix CACHE_BUST que el pas 1, així reutilitza la build
      #    ja verificada (cache local del builder) i no recompila.
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          # Si algun dia necessites ARM (Raspberry, etc.): linux/amd64,linux/arm64
          # (cal afegir abans docker/setup-qemu-action@v4 i el build serà més lent)
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
